name: CI - Build Microservices

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci.yaml'
      - '.hadolint.yaml'
      - '.trivyignore'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci.yaml'
      - '.hadolint.yaml'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service to build (e.g. frontend, cartservice) or leave blank for changed'
        required: false
        type: string
        default: ''
      build_all:
        description: 'Force build of all microservices'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  id-token: write

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
      has_changes: ${{ steps.set-services.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            adservice:
              - 'src/adservice/**'
            cartservice:
              - 'src/cartservice/**'
            checkoutservice:
              - 'src/checkoutservice/**'
            currencyservice:
              - 'src/currencyservice/**'
            emailservice:
              - 'src/emailservice/**'
            frontend:
              - 'src/frontend/**'
            loadgenerator:
              - 'src/loadgenerator/**'
            paymentservice:
              - 'src/paymentservice/**'
            productcatalogservice:
              - 'src/productcatalogservice/**'
            recommendationservice:
              - 'src/recommendationservice/**'
            shippingservice:
              - 'src/shippingservice/**'
            shoppingassistantservice:
              - 'src/shoppingassistantservice/**'

      - name: Determine Services to Build
        id: set-services
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice","shoppingassistantservice"]'

          # 1. Manual single service input
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "Building explicitly requested service: ${{ github.event.inputs.service }}"
            SERVICES="[\"${{ github.event.inputs.service }}\"]"
          # 2. Manual build_all input
          elif [ "${{ github.event.inputs.build_all }}" = "true" ]; then
            echo "Building all services via manual trigger"
            SERVICES="$ALL_SERVICES"
          # 3. Changes detected via paths-filter
          else
            DETECTED='${{ steps.filter.outputs.changes }}'
            if [ -z "$DETECTED" ] || [ "$DETECTED" = "[]" ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
                echo "No service files changed directly; defaulting to frontend for pipeline verification"
                SERVICES='["frontend"]'
              else
                SERVICES='[]'
              fi
            else
              echo "Detected changes in: $DETECTED"
              SERVICES="$DETECTED"
            fi
          fi

          echo "Final services list: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          if [ "$SERVICES" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Dockerfile (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Dockerfile Path
        id: paths
        run: |
          SERVICE="${{ matrix.service }}"
          if [ "$SERVICE" = "cartservice" ]; then
            echo "file=src/cartservice/src/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=src/${SERVICE}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ steps.paths.outputs.file }}
          config: .hadolint.yaml
          failure-threshold: warning

  test:
    name: Unit Tests (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Test Framework
        id: svc
        run: |
          SERVICE="${{ matrix.service }}"
          if [ "$SERVICE" = "cartservice" ]; then
            echo "type=dotnet" >> "$GITHUB_OUTPUT"
            echo "dir=src/cartservice" >> "$GITHUB_OUTPUT"
          elif [ -f "src/${SERVICE}/go.mod" ]; then
            echo "type=go" >> "$GITHUB_OUTPUT"
            echo "dir=src/${SERVICE}" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "dir=src/${SERVICE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.svc.outputs.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Set up .NET
        if: steps.svc.outputs.type == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Run Unit Tests
        run: |
          TYPE="${{ steps.svc.outputs.type }}"
          DIR="${{ steps.svc.outputs.dir }}"
          if [ "$TYPE" = "go" ]; then
            echo "Running Go unit tests in $DIR..."
            cd "$DIR"
            go test -v ./...
          elif [ "$TYPE" = "dotnet" ]; then
            echo "Running .NET unit tests in $DIR..."
            dotnet test src/cartservice/tests/
          else
            echo "No automated unit tests configured for ${{ matrix.service }} (skipping)"
          fi

  build:
    name: Build (${{ matrix.service }})
    needs: [changes, lint, test]
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Context & Dockerfile
        id: paths
        run: |
          SERVICE="${{ matrix.service }}"
          if [ "$SERVICE" = "cartservice" ]; then
            echo "context=./src/cartservice/src" >> "$GITHUB_OUTPUT"
            echo "file=./src/cartservice/src/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "context=./src/${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "file=./src/${SERVICE}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi
          echo "Building service: $SERVICE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.file }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify Built Image
        run: |
          docker images "${{ matrix.service }}:${{ github.sha }}"

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Run Trivy Vulnerability Scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          scan-type: 'image'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      - name: Run Trivy Vulnerability Scanner (Quality Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          scan-type: 'image'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag and Push Image to ACR
        id: push-image
        run: |
          ACR_REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          SERVICE="${{ matrix.service }}"
          IMAGE_NAME="${ACR_REGISTRY}/${SERVICE}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"

          echo "Tagging image: ${IMAGE_NAME}:sha-${SHORT_SHA}"
          docker tag "${SERVICE}:${{ github.sha }}" "${IMAGE_NAME}:sha-${SHORT_SHA}"

          echo "Pushing primary tag: ${IMAGE_NAME}:sha-${SHORT_SHA}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA}"

          # Tag and push 'latest' if on main branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Pushing 'latest' tag for main branch..."
            docker tag "${SERVICE}:${{ github.sha }}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi

          # Tag and push semantic version if release tag
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            echo "Pushing release tag '${RELEASE_TAG}'..."
            docker tag "${SERVICE}:${{ github.sha }}" "${IMAGE_NAME}:${RELEASE_TAG}"
            docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          fi

          # Resolve immutable repo digest
          REPO_DIGEST="$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "${IMAGE_NAME}:sha-${SHORT_SHA}" | grep "^${IMAGE_NAME}@" | head -n1)"
          if [ -z "$REPO_DIGEST" ]; then
            RAW_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_NAME}:sha-${SHORT_SHA}" | cut -d'@' -f2)"
            REPO_DIGEST="${IMAGE_NAME}@${RAW_DIGEST}"
          fi

          echo "Pushed image digest: ${REPO_DIGEST}"
          echo "image_digest=${REPO_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sign Image with Cosign (Keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.image_digest }}
        run: |
          echo "Signing image digest with Cosign (Keyless via Sigstore): ${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Attest SBOM with Cosign
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.image_digest }}
        run: |
          SBOM_FILE="sbom-${{ matrix.service }}.spdx.json"
          echo "Attesting SBOM (${SBOM_FILE}) to ${IMAGE_DIGEST}..."
          cosign attest --yes --predicate "${SBOM_FILE}" --type spdx "${IMAGE_DIGEST}"

      - name: Verify Image Signature
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.image_digest }}
        run: |
          echo "Verifying signature of ${IMAGE_DIGEST}..."
          cosign verify \
            --timeout 60s \
            --certificate-identity-regexp "https://github.com/miguelortiz13/online-boutique-ci/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_DIGEST}"

      - name: Set up Kustomize
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          if ! command -v kustomize &> /dev/null; then
            echo "Installing kustomize..."
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi
          kustomize version

      - name: Promote to GitOps (platform-gitops)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PROMOTION_TOKEN }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.push-image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.push-image.outputs.image_digest }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GITOPS_PROMOTION_TOKEN not configured; skipping GitOps promotion."
            exit 0
          fi

          echo "Configuring git author identity..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          GITOPS_REPO="miguelortiz13/platform-gitops"
          TEMP_DIR="$(mktemp -d)"

          echo "Cloning ${GITOPS_REPO} into ${TEMP_DIR}..."
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITOPS_REPO}.git" "${TEMP_DIR}"
          cd "${TEMP_DIR}/apps/online-boutique/overlays/dev"

          ACR_REGISTRY="${ACR_NAME}.azurecr.io"
          TARGET_IMAGE="${ACR_REGISTRY}/${SERVICE}:${IMAGE_TAG}"

          echo "Updating overlay/dev image for ${SERVICE} to ${TARGET_IMAGE}..."
          kustomize edit set image "${ACR_REGISTRY}/${SERVICE}=${TARGET_IMAGE}"

          if git diff --quiet kustomization.yaml; then
            echo "No image changes detected in dev overlay. Exiting cleanly."
            exit 0
          fi

          BRANCH="promote/${SERVICE}-${IMAGE_TAG}"
          echo "Switching to branch ${BRANCH}..."
          git checkout -b "${BRANCH}"
          git add kustomization.yaml
          git commit -m "chore(gitops): promote ${SERVICE} to ${IMAGE_TAG} [skip ci]"

          echo "Pushing branch ${BRANCH} to origin..."
          git push -u origin "${BRANCH}" --force

          echo "Checking for existing pull requests..."
          EXISTING_PR=$(gh pr list --repo "${GITOPS_REPO}" --head "${BRANCH}" --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request already exists: #${EXISTING_PR}"
          else
            echo "Creating Pull Request on ${GITOPS_REPO}..."
            echo "Creating Pull Request body..."
            {
              echo "### 🚀 Automated GitOps Image Promotion"
              echo ""
              echo "- **Service:** \`${SERVICE}\`"
              echo "- **New Image Tag:** \`${IMAGE_TAG}\`"
              echo "- **Image Digest:** \`${IMAGE_DIGEST}\`"
              echo "- **Source Repository:** \`${{ github.repository }}\`"
              echo "- **Triggered By Commit:** \`${{ github.sha }}\`"
              echo "- **Workflow Run:** [Run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo "- **Target Environment:** \`dev\` (\`apps/online-boutique/overlays/dev\`)"
              echo "- **Supply Chain Security:**"
              echo "  - ✅ SBOM generated with Syft (SPDX JSON 2.3)"
              echo "  - ✅ Trivy SARIF Vulnerability Scan passed Quality Gate"
              echo "  - ✅ Cosign signature verified (Keyless via Sigstore & GitHub OIDC)"
              echo "  - ✅ SBOM attestation attached to image digest in ACR"
              echo ""
              echo "---"
              echo "*Generated automatically by CI pipeline in \`${{ github.repository }}\`.*"
            } > /tmp/pr-body.md
            PR_URL=$(gh pr create \
              --repo "${GITOPS_REPO}" \
              --base main \
              --head "${BRANCH}" \
              --title "chore(gitops): promote ${SERVICE} to ${IMAGE_TAG}" \
              --body-file /tmp/pr-body.md)
            echo "Pull Request successfully created: ${PR_URL}"
          fi
